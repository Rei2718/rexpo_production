name: Update Event Rankings

on:
  schedule:
    - cron: "*/5 * * * *" # 5分ごとに実行するように変更
  workflow_dispatch: # 手動実行用

jobs:
  update-rankings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run update script
        # tsxを使用して直接TypeScriptファイルを実行します
        # package.jsonにtsxがない場合は npx tsx supabase/sql/scripts/update-rankings.ts を使用します
        run: npx tsx supabase/sql/scripts/update-rankings.ts
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
          POSTHOG_PROJECT_ID_PRODUCTION: "${{ secrets.POSTHOG_PROJECT_ID_PRODUCTION }}"
          POSTHOG_API_KEY_PRODUCTION: "${{ secrets.POSTHOG_API_KEY_PRODUCTION }}"
